name: amba
version: 0.1.0
spec: '0.1'
kind: library
identity:
  slug: amba-tapeout-bsv
  display_name: AMBA bindings for the neutral register contract
  summary: The only place in the library that knows what APB4 looks like.
  category: infrastructure
  maturity: simulated
deps:
  hwcore: ^0.1
area:
  probe:
    module: mkApb4BindProbe
    src: htest/Probe.bsv
    check: true
  base:
    fixed: 100.0
  model: single-point
  error:
    bound: 0.05
    sign: over
    note: the price must cover what the binder costs in place, which is the wrap measured minus the neutral top measured. Four IPs give plus 85.40 for uart, plus 71.96 for gpio, plus 96.04 for wdt and minus
      242.20 for rtc, where a neutral top has to carry the whole register interface out to ports and synthesis cannot touch it. A single figure can only be the upper bound of that spread, so it is 100.
      The probe in tb measures the binder on its own against a stub and gives 17.92, which is a lower bound and is checked rather than written back
  corner:
    tool: ecc
    pdk: ics55
    freq_mhz: 100
    measured: '2026-09-16'
    toolchain: bsc 2026.01 · yosys 0.68+195 · ecc 0.1.0a11
    gen_digest: sha256:33178e6d3773a851
params:
  aw:
    type: choice
    values:
    - 8
    - 12
    - 16
    - 32
    default: 8
  dw:
    type: choice
    values:
    - 32
    - 64
    default: 32
test:
  noarea:
  - aw
  - dw
